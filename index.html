
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TYPE RUSH</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1220;color:#eef4ff;
 font-family:Arial,"Noto Sans JP",sans-serif;
 min-height:100vh;display:flex;justify-content:center;
 padding:25px 14px
}
main{width:100%;max-width:650px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.logo{font-size:27px;font-weight:900;letter-spacing:3px}
.online{color:#54d6a0;font-size:11px;border:1px solid #34785f;padding:7px 12px;border-radius:30px}
.card{background:#142136;border:1px solid #2b3b52;border-radius:18px;padding:22px;margin-bottom:16px}
h1{font-size:27px;margin:0 0 10px}
p{color:#91a4bb;line-height:1.7;font-size:14px}
input{width:100%;padding:14px;background:#0b1628;border:1px solid #34465f;border-radius:10px;color:white;font-size:17px;margin:8px 0 14px}
button{padding:13px 18px;border:0;border-radius:10px;background:#54d6a0;color:#062218;font-weight:bold;font-size:15px;cursor:pointer}
button.secondary{background:#26374e;color:white}
button:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#0b1628;padding:13px;border-radius:12px}
.stat small{display:block;color:#91a4bb;font-size:11px}
.stat strong{font-size:25px}
.question{text-align:center;background:#0b1628;border-radius:14px;padding:25px 10px;margin:18px 0}
.japanese{font-size:34px;font-weight:bold;margin:12px 0}
.romaji{font-size:25px;color:#54d6a0;font-weight:bold;overflow-wrap:anywhere}
.hint{font-size:12px;color:#91a4bb;text-align:center}
.hidden{display:none}
ol{padding-left:25px}
li{padding:9px;border-bottom:1px solid #2b3b52}
#message{min-height:22px;color:#54d6a0;text-align:center}
@media(max-width:450px){.card{padding:16px}.japanese{font-size:29px}}
 
.romaji span {
  transition: color .08s;
}
.romaji .typed {
  color: #54d6a0;
}
.romaji .wrong {
  color: #ff626c;
  text-decoration: underline;
}
.romaji .waiting {
  color: #8191a8;
}
#combo {
  color: #f5bd55;
  font-size: 19px;
  font-weight: bold;
  text-align: center;
  margin: 12px;
}

</style>
</head>
<body>
<main>
<header>
 <div class="logo">TYPE RUSH</div>
 <div class="online">● JAPANESE TYPING</div>
</header>

<section id="home" class="card">
 <h1>速く、正確に。</h1>
 <p>日本語をローマ字で入力してスコアを競おう！</p>
 <label>プレイヤー名</label>
 <input id="name" maxlength="12" placeholder="名前を入力">
 <div class="row">
  <button onclick="startGame()">ゲームスタート</button>
  <button class="secondary" onclick="accountInfo()">ログイン</button>
 </div>
 <p class="hint">ゲストとしてすぐに遊べます。</p>
</section>

<section id="game" class="card hidden">
 <div class="row" style="justify-content:space-between;align-items:center">
  <strong id="player"></strong>
  <button class="secondary" onclick="quitGame()">終了</button>
 </div>
 <div class="stats">
  <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
  <div class="stat"><small>TIME</small><strong id="time">60</strong></div>
  <div class="stat"><small>ACCURACY</small><strong id="accuracy">100%</strong></div>
 </div>
 <div class="question">
  <div class="hint">TYPE THIS WORD</div>
  <div class="japanese" id="japanese">ありがとう</div>
  <div class="romaji" id="romaji">arigatou</div>
 </div>
 <input id="answer" placeholder="ローマ字を入力" autocomplete="off" autocapitalize="off" spellcheck="false">
 <div id="message">入力してね！</div>
 <p class="hint">正しく入力すると次のお題に進みます。</p>
</section>

<section id="result" class="card hidden">
 <h1>RESULT</h1>
 <p>お疲れさま！今回の結果はこちら。</p>
 <div class="stats">
  <div class="stat"><small>SCORE</small><strong id="finalScore">0</strong></div>
  <div class="stat"><small>ACCURACY</small><strong id="finalAccuracy">100%</strong></div>
  <div class="stat"><small>WORDS</small><strong id="finalWords">0</strong></div>
 </div>
 <br>
 <button onclick="startGame()">もう一度遊ぶ</button>
 <button class="secondary" onclick="showHome()">ホームへ</button>
</section>

<section class="card">
 <h2>LOCAL RANKING</h2>
 <p>この端末でのランキング</p>
 <ol id="ranking"><li>まだ記録がありません</li></ol>
</section>
<footer class="hint">TYPE RUSH © 2026</footer>
</main>

<script>
const questions=[
 ["ありがとう","arigatou"],
 ["こんにちは","konnichiwa"],
 ["おはよう","ohayou"],
 ["さようなら","sayounara"],
 ["ねこ","neko"],
 ["いぬ","inu"],
 ["すいか","suika"],
 ["りんご","ringo"],
 ["たまご","tamago"],
 ["とまと","tomato"],
 ["がんばろう","ganbarou"],
 ["ありがとう！","arigatou"],
 ["学校","gakkou"],
 ["友達","tomodachi"],
 ["ゲーム","geemu"],
 ["日本語","nihongo"],
 ["音楽","ongaku"],
 ["コーヒー","koohii"],
 ["こんにちは！","konnichiwa"],
 ["おやすみ","oyasumi"]
];

let score=0,words=0,correct=0,total=0;
let time=60,timer=null,current=null,active=false;
let playerName="GUEST";

const $=id=>document.getElementById(id);
// 効果音
const keySound = new Audio("key.mp3"); // ファイルの場所に合わせて変えてください
keySound.volume = 0.4;

function playKeySound(){
  keySound.currentTime = 0;
  keySound.play().catch(()=>{});
}
function accountInfo(){
 alert("アカウント登録機能はオンライン版で追加予定です。今はゲストで遊べます！");
}

function startGame(){
 playerName=$("name").value.trim()||"GUEST";
 $("home").classList.add("hidden");
 $("result").classList.add("hidden");
 $("game").classList.remove("hidden");
 $("player").textContent=playerName;
 score=0;words=0;correct=0;total=0;time=60;active=true;
 $("answer").value="";
 updateStats();nextQuestion();
 clearInterval(timer);
 timer=setInterval(()=>{
  time--;
  $("time").textContent=time;
  if(time<=0)endGame();
 },1000);
 $("answer").focus();
}

function nextQuestion(){
  current=questions[Math.floor(Math.random()*questions.length)];
  $("japanese").textContent=current[0];
  
  // ローマ字を1文字ずつspanにする
  const romaji = current[1];
  $("romaji").innerHTML = [...romaji].map(c => 
    `<span class="waiting">${c}</span>`
  ).join("");
  
  $("answer").value="";
  $("message").textContent="入力してね！";
  $("answer").focus();
}

 $("answer").addEventListener("input",()=>{
  if(!active)return;
  let typed = $("answer").value.toLowerCase();
  const target = current[1];
  const spans = $("romaji").querySelectorAll("span");
  
  // 間違えた文字を自動で消す
  if(typed.length > 0 && !target.startsWith(typed)){
    typed = typed.slice(0, -1); // 最後の1文字を消す
    $("answer").value = typed;
  }
  
 if(typed.length > 0){
  playKeySound();
}
  
  total = typed.length;
  let matched = 0;
  
  // 文字ごとに色を更新
  spans.forEach((span, i) => {
    span.className = "waiting";
    if(i < typed.length){
      if(typed[i] === target[i]){
        span.className = "typed";
        matched++;
      } else {
        span.className = "wrong";
      }
    }
  });
  
  correct = matched;
  $("accuracy").textContent = total ? Math.round(correct/total*100)+"%" : "100%";
  
  if(typed === target){
    score += target.length * 10;
    words++;
    updateStats();
    $("message").textContent = "正解！";
    nextQuestion();
  } else {
    $("message").textContent = "入力してね！";
  }
});

function updateStats(){
 $("score").textContent=score;
 $("time").textContent=time;
 $("accuracy").textContent=total?
 Math.round(correct/total*100)+"%":"100%";
}

function endGame(){
 active=false;clearInterval(timer);
 $("game").classList.add("hidden");
 $("result").classList.remove("hidden");
 const accuracy=total?Math.round(correct/total*100):100;
 $("finalScore").textContent=score;
 $("finalAccuracy").textContent=accuracy+"%";
 $("finalWords").textContent=words;
 saveRanking();
}

function quitGame(){
 if(confirm("ゲームを終了する？")){
  active=false;clearInterval(timer);showHome();
 }
}

function showHome(){
 $("game").classList.add("hidden");
 $("result").classList.add("hidden");
 $("home").classList.remove("hidden");
}

function saveRanking(){
 let ranking=JSON.parse(localStorage.getItem("typeRushRanking")||"[]");
 ranking.push({name:playerName,score:score});
 ranking.sort((a,b)=>b.score-a.score);
 ranking=ranking.slice(0,10);
 localStorage.setItem("typeRushRanking",JSON.stringify(ranking));
 displayRanking();
}

function displayRanking(){
 const ranking=JSON.parse(localStorage.getItem("typeRushRanking")||"[]");
 $("ranking").innerHTML="";
 if(!ranking.length){
  $("ranking").innerHTML="<li>まだ記録がありません</li>";
  return;
 }
 ranking.forEach((r,i)=>{
  const li=document.createElement("li");
  li.textContent=(i+1)+"位　"+r.name+"　"+r.score+"点";
  $("ranking").appendChild(li);
 });
}
displayRanking();
</script>
</body>
</html>
